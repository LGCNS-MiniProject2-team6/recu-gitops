apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recu-prod-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: recu
    app.kubernetes.io/component: gitops
    environment: prod
spec:
  project: recu
  source:
    repoURL: https://github.com/LGCNS-MiniProject2-team6/recu-gitops.git
    targetRevision: main
    path: overlays/prod-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: recu-prod
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
